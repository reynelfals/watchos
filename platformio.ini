; Watch OS - Waveshare ESP32-S3-Touch-AMOLED-2.06 (wearable, 410x502)
; Official examples: https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.06
; Wiki requires Arduino-ESP32 >= 3.2.0, so this uses pioarduino (Arduino 3.3.11).
;
; First install on a factory watch (CRITICAL):
;   pio run -t erase
;   pio run -t upload -t uploadfs
; Never run uploadfs alone on factory firmware - it corrupts the flash map.
; Later code-only updates: pio run -t upload
; PWR: click = power on; hold ~6s = power off.
;
; USB: default env uses HW CDC/JTAG (USB_MODE=1) so esptool works on /dev/ttyACM0.
; Optional env waveshare-amoled-206-msc uses TinyUSB (USB_MODE=0) for USB SD MSC.
; See docs/USB_FLASH.md.

[platformio]
default_envs = waveshare-amoled-206
src_dir = src

[env:waveshare-amoled-206]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = waveshare-esp32-s3-touch-amoled-206
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 32MB
board_build.partitions = partitions/large_littlefs_32MB.csv
board_build.filesystem = littlefs
; HW CDC/JTAG — reliable esptool / ACM0 (USB SD MSC not available)
build_unflags =
    -DARDUINO_USB_MODE=0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD_MMC/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    moononournation/GFX Library for Arduino@1.6.0
    lvgl/lvgl@9.3.0
    lewisxhe/XPowersLib@0.2.6
    lewisxhe/SensorLib@0.3.1
lib_ldf_mode = chain+
; Prefer NimBLE over framework Bluedroid BLE (RAM).
lib_ignore = BLE, SimpleBLE

; TinyUSB OTG — USB SD (MSC) works; ACM0 ROM download may need UART or BOOT cold-plug
[env:waveshare-amoled-206-msc]
extends = env:waveshare-amoled-206
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD_MMC/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
